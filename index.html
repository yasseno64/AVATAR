<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AVATAR</title>
    <link rel="stylesheet" href="avatar.css">
</head>
<body>
    <div class="container">
        <header>
            <a href="#" class="logo">AVATAR</a>
            <ul>
                <li><a href="#">Home</a></li>
                <li><a href="#">Clans</a></li>
                <li><a href="#">Videos</a></li>
                <li><a href="#">Photos</a></li>
                <li><a href="#">About</a></li>
                
            </ul>
        </header>
        <div class="content">
            <h2>avatar</h2>
            <p>Lorem ipsum dolor sit amet consectetur, adipisicing elit. Nulla voluptatum odio aut id! Eaque possimus, id exercitationem inventore perferendis impedit quo! Laborum tempore ad impedit possimus quae, assumenda laudantium velit?</p>
            <button>Click Here</button>
        </div>
    </div>
    <script>
    const container = document.querySelector(".container");

    container.addEventListener("mousemove", (e) => {
        const rect = container.getBoundingClientRect();

        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;

        const moveX = (x / rect.width - 0.5) * 30;
        const moveY = (y / rect.height - 0.5) * 30;

        container.style.backgroundPosition =
            `calc(50% + ${moveX}px) calc(50% + ${moveY}px)`;
    });

    container.addEventListener("mouseleave", () => {
        container.style.backgroundPosition = "center";
    });
</script>
</body>
</html>
